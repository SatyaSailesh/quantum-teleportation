services:
  - type: web
    name: quantum-teleportation-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: CORS_ORIGINS
        value: https://quantum-teleportation-two.vercel.app

  - type: web
    name: quantum-teleportation-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quantum-teleportation-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
