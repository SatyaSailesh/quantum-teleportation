<svg xmlns="http://www.w3.org/2000/svg" class="teleportation-circuit" role="img" aria-label="Executed Qiskit teleportation circuit" viewBox="0 0 934 394" width="934" height="394"><style>.teleportation-circuit text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace} .teleportation-circuit .small{font-size:10px} .teleportation-circuit .wire{stroke:#4b607a;stroke-width:1.3} .teleportation-circuit .cw{stroke:#6e829e;stroke-width:1} .teleportation-circuit .gate{fill:#1e354b;stroke:#6c9ebb;stroke-width:1.2}</style><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8ba1bd"/></marker></defs><rect width="934" height="394" rx="8" fill="#111c2d"/><rect x="172" y="25" width="60" height="30" rx="7" fill="#172334"/><text x="202.0" y="44" text-anchor="middle" font-size="10" fill="#b8cbe3">Input</text><rect x="246" y="25" width="126" height="30" rx="7" fill="#182f3c"/><text x="309.0" y="44" text-anchor="middle" font-size="10" fill="#b8cbe3">Bell pair</text><rect x="378" y="25" width="126" height="30" rx="7" fill="#1c213b"/><text x="441.0" y="44" text-anchor="middle" font-size="10" fill="#b8cbe3">Bell measurement</text><rect x="510" y="25" width="126" height="30" rx="7" fill="#1c213b"/><text x="573.0" y="44" text-anchor="middle" font-size="10" fill="#b8cbe3">Readout</text><rect x="642" y="25" width="126" height="30" rx="7" fill="#152a29"/><text x="705.0" y="44" text-anchor="middle" font-size="10" fill="#b8cbe3">Feed forward</text><rect x="774" y="25" width="60" height="30" rx="7" fill="#172334"/><text x="804.0" y="44" text-anchor="middle" font-size="10" fill="#b8cbe3">Bob output</text><text x="16" y="101" fill="#d6e5f4" font-size="12" font-weight="600">q0</text><text x="16" y="117" fill="#8194ad" font-size="9">Alice · input |ψ⟩</text><line x1="160" y1="107" x2="914" y2="107" class="wire"/><text x="16" y="168" fill="#d6e5f4" font-size="12" font-weight="600">q1</text><text x="16" y="184" fill="#8194ad" font-size="9">Alice · Bell pair</text><line x1="160" y1="174" x2="914" y2="174" class="wire"/><text x="16" y="235" fill="#d6e5f4" font-size="12" font-weight="600">q2</text><text x="16" y="251" fill="#8194ad" font-size="9">Bob · Bell pair &amp; output ρ</text><line x1="160" y1="241" x2="914" y2="241" class="wire"/><text x="16" y="315" fill="#90a4bf" font-size="11">mZ ← q0</text><line x1="160" y1="309" x2="914" y2="309" class="cw"/><line x1="160" y1="313" x2="914" y2="313" class="cw"/><text x="16" y="353" fill="#90a4bf" font-size="11">mX ← q1</text><line x1="160" y1="347" x2="914" y2="347" class="cw"/><line x1="160" y1="351" x2="914" y2="351" class="cw"/><g data-operation="u" data-noise="false" data-condition=""><title>U · Input preparation</title><rect x="176.0" y="89" width="52" height="36" rx="6" fill="#173b46" stroke="#6c9ebb"/><text x="202" y="112" text-anchor="middle" font-size="13" fill="#daf0fc">ψ(θ,φ)</text></g><g data-operation="h" data-noise="false" data-condition=""><title>H · Bell pair</title><rect x="259.0" y="156" width="34" height="36" rx="6" fill="#1e354b" stroke="#6c9ebb"/><text x="276" y="179" text-anchor="middle" font-size="13" fill="#daf0fc">H</text></g><g data-operation="cx" data-noise="false" data-condition=""><title>CX · Bell pair</title><line x1="342" y1="174" x2="342" y2="241" stroke="#b1c3df" stroke-width="1.6"/><circle cx="342" cy="174" r="4.5" fill="#b1c3df"/><circle cx="342" cy="241" r="13" fill="#132235" stroke="#b1c3df" stroke-width="1.5"/><path d="M334,241h16 M342,233v16" stroke="#b1c3df" stroke-width="1.5"/></g><g data-operation="cx" data-noise="false" data-condition=""><title>CX · Bell measurement</title><line x1="408" y1="107" x2="408" y2="174" stroke="#b1c3df" stroke-width="1.6"/><circle cx="408" cy="107" r="4.5" fill="#b1c3df"/><circle cx="408" cy="174" r="13" fill="#132235" stroke="#b1c3df" stroke-width="1.5"/><path d="M400,174h16 M408,166v16" stroke="#b1c3df" stroke-width="1.5"/></g><g data-operation="h" data-noise="false" data-cond